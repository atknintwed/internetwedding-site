*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px;overflow-anchor:none}
body{overflow-anchor:none}
body{margin:0;background:var(--paper);color:var(--black);font-family:"IW Diatype","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5}
a{color:inherit}
a:hover{text-decoration-thickness:2px}
img,svg{max-width:100%}
.in{max-width:1360px;margin:0 auto;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.hd{font-family:"IW Rounded","Helvetica Neue",Arial,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lbl{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.mute{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--black)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:16px 28px;min-height:72px;flex-wrap:wrap;padding-block:10px}
.logo{display:block;line-height:0;margin-left:-6px}
.logo svg{height:36px;width:auto}
.nav{display:flex;gap:28px;flex-wrap:wrap}
.nav a,.btn,.lang button{font-family:"IW Rounded",Arial,sans-serif;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.nav a{font-size:14px;text-decoration:none;padding:8px 0}
.nav .mob{display:none}
.nav a:hover,.nav a[aria-current="page"]{text-decoration:underline;text-underline-offset:5px}
.tools{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:2px solid var(--black)}
.lang button{font-size:13px;background:transparent;border:0;padding:0 10px;min-height:40px;min-width:44px;cursor:pointer;color:var(--black)}
.lang button[aria-pressed="true"]{background:var(--black);color:var(--white)}
.btn{font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 20px;border:2px solid var(--black);background:var(--white);color:var(--black);cursor:pointer}
.btn:hover{background:var(--pink);color:var(--black)}
.btn.dark{background:var(--black);color:var(--white)}
.btn.dark:hover{background:var(--pink);color:var(--black)}

/* page transition + scroll reveal */
#app{animation:pagein .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.js .rv{opacity:0;transform:translateY(36px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.js .rv.on{opacity:1;transform:none}
.js .rv-d1{transition-delay:.08s}.js .rv-d2{transition-delay:.16s}.js .rv-d3{transition-delay:.24s}

/* sections */
.hero{background:var(--pink)}
.hero .in{padding-top:28px;padding-bottom:56px;display:flex;flex-direction:column;gap:44px}
.meta{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.hero h1{font-size:clamp(52px,10.4vw,156px);line-height:.88}
.mw{display:inline-block;padding:.1em 0;margin:-.1em 0;color:transparent;-webkit-background-clip:text;background-clip:text;background-repeat:repeat-x;background-color:var(--black)}
.mw.bgm{background-color:transparent}
.gw{position:relative;display:inline-block}
.gl{position:absolute;left:0;top:0;opacity:0;pointer-events:none;white-space:nowrap}
.gl.px{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.gbl{display:inline-block;width:0;height:0;vertical-align:baseline}
.gl.k{color:var(--black)}.gl.r{color:#EA2F2F}.gl.g{color:#00C46A}.gl.b{color:#2B59F0}
.gw.on>.mw,.gw.on>.gwt{visibility:visible}
.two{display:flex;gap:40px;align-items:flex-end;justify-content:space-between}
.two>*{min-width:0}
.lede{margin:0;font-size:clamp(19px,1.8vw,24px);line-height:1.35;max-width:36ch}
.latest{display:flex;gap:16px;align-items:center;text-decoration:none;background:var(--black);color:var(--white);padding:14px 22px 14px 14px;flex:none}
.latest:hover{background:#000}
.sq{width:72px;height:72px;flex:none;background-color:var(--lime);display:flex;padding:7px;box-sizing:border-box}

.ticker{background:var(--black);color:var(--white);overflow:hidden;white-space:nowrap}
.ticker .row{display:flex;width:max-content;font-size:22px;letter-spacing:.02em;padding:14px 0;-webkit-animation:marq 40s linear infinite;animation:marq 40s linear infinite;will-change:transform}
.ticker .row>span{padding-right:0}
.ticker .row>span>span{padding-right:14px}
@-webkit-keyframes marq{from{-webkit-transform:translate3d(0,0,0)}to{-webkit-transform:translate3d(-50%,0,0)}}
@keyframes marq{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}

.sec{border-bottom:2px solid var(--black)}
.sec .in{padding-top:72px;padding-bottom:80px;display:flex;flex-direction:column;gap:32px}
.h2{font-size:clamp(40px,5.4vw,80px);line-height:.95}

.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.tile{display:flex;flex-direction:column;gap:12px;text-decoration:none;min-width:0}
.cover{aspect-ratio:1/1;max-width:100%;border:2px solid var(--black);display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:18px;transition:transform .25s}
.tile:hover .cover{transform:translateY(-6px)}
.cover.cimg{padding:0;overflow:hidden;background:var(--black)}
.cimg img,.sq img,.sw img{width:100%;height:100%;object-fit:cover;display:block}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:24px}
.vbox{aspect-ratio:16/9;border:2px solid var(--black);background:var(--black)}
.vbox iframe{width:100%;height:100%;border:0;display:block}
textarea.tx{min-height:150px;resize:vertical;font:inherit;line-height:1.45;padding-top:12px;padding-bottom:12px}
.tile-sub{font-size:15px;color:var(--mute);margin-top:2px}
.cover .t{font-size:24px;line-height:1.05;letter-spacing:-.01em}
.tile-meta{display:flex;justify-content:space-between;gap:12px;border-top:2px solid var(--black);padding-top:10px}
.tile-meta b{font-weight:500;font-size:17px}

/* pattern variants (A half unit, B full unit, C guideline repeat) */
.pat{width:100%;flex:none;background-position:left top}
.pat.k{--pb:var(--half-b);--fb:var(--full-b);--fnb:var(--fn-b)}
.pat.w{--pb:var(--half-w);--fb:var(--full-w);--fnb:var(--fn-w)}
.band{background:var(--black)}
.band .in{padding-top:56px}
.ipat{display:block;width:100%;height:auto;flex:none}
.ipat.cmp{position:relative;overflow:hidden;contain:paint}
.ipat.cmp .prow{position:absolute;left:0;will-change:transform;backface-visibility:hidden}
.ipat.cmp .prow svg{display:block;width:100%;height:100%}
.ipat.cmp{width:100vw;max-width:none;margin-left:calc(50% - 50vw)}
.pfill{flex:1 1 auto;min-height:0;display:flex;contain:layout paint}
.pfill .ipat{height:100%;width:100%}
.hero-pat{margin-top:-8px}
@media (max-width:700px){.ipat.wide{height:110px}.ipat.wide.cmp{height:auto}}

/* roster */
.roster{container-type:inline-size}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:24px;text-decoration:none;border-top:2px solid var(--black);padding:12px 0 8px}
.rname{line-height:1;white-space:nowrap;min-width:0;transition:color .15s;font-size:clamp(28px,calc((100cqw - 330px) / 10),100px)}
@media (hover:hover){.rrow:hover .rname{color:var(--pink)}}
.rrow:focus-visible .rname,.rrow:active .rname{color:var(--pink)}
.rmeta{display:grid;grid-template-columns:120px 160px;gap:16px}
.end{border-top:2px solid var(--black)}
.sec.inv{background:var(--black);color:var(--white)}
.inv .rrow,.inv .end{border-color:var(--white);color:var(--white)}
.inv .mute{color:var(--mute-d)}

/* how we work */
.svc{border-bottom:2px solid var(--black)}
.svc-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px 40px;align-items:baseline;border-top:2px solid var(--black);padding:18px 0}
.svc-row h3{font-size:clamp(26px,3vw,44px);line-height:1.05;margin:0}
.svc-row p{margin:0;font-size:18px;line-height:1.45}
@media (max-width:700px){.svc-row{grid-template-columns:minmax(0,1fr)}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border:2px solid var(--black)}
.col{padding:28px;display:flex;flex-direction:column;gap:48px;min-width:0}
.col+.col{border-left:2px solid var(--black)}
.col ul{margin:0;padding:0;list-style:none;font-size:17px}
.col li{border-top:2px solid var(--black);padding:8px 0}
.col{background:var(--white)}
.col.inv{background:var(--black);color:var(--white)}
.col.pk{background:var(--pink)}
.col.inv li{border-top-color:var(--white)}
.col .lbl{font-family:"IW Rounded",Arial,sans-serif;font-size:56px;letter-spacing:-.02em;line-height:1}

/* about */
.about{background:var(--black);color:var(--white)}
.about .in{padding-top:72px;padding-bottom:88px}
.quote-big{font-size:clamp(30px,4vw,58px);line-height:1.12;letter-spacing:-.015em}
.cat a{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;border-top:2px solid var(--white);padding:12px 0;text-decoration:none}
.cat a:last-child{border-bottom:2px solid var(--white)}
.cat a:hover span:last-child{text-decoration:underline}

.send{background:var(--lime);border-bottom:2px solid var(--black)}
.send .in{padding-top:72px;padding-bottom:72px}
.send h2{font-size:clamp(52px,9vw,136px);line-height:1}

/* footer */
.foot{background:var(--black);color:var(--white)}
.foot .in{padding-top:64px;padding-bottom:28px;display:flex;flex-direction:column;gap:48px}
.foot .stack svg{width:240px;height:auto}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:36px;flex:1;max-width:760px;width:100%}
.fcols>div{display:flex;flex-direction:column;gap:8px;font-size:15px;min-width:0}
.fcols .lbl{color:var(--lime)}
.nl{font:inherit;font-size:15px;background:var(--black);color:var(--white);border:2px solid var(--white);padding:10px 12px;min-height:44px;width:100%}
.fbar{display:flex;justify-content:space-between;align-items:center;gap:12px 16px;flex-wrap:wrap;border-top:2px solid var(--white);padding-top:16px}
.patsw{display:flex;align-items:center;gap:6px}

function plTick(once){
